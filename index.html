<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brunch & Smash Burger</title>
<style>
    body {
        background-color: #000;
        color: #fff;
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }
    h1, h2 {
        text-align: center;
        color: #fff;
        text-shadow: 0 0 10px #fff;
    }
    select, button {
        padding: 10px;
        margin: 10px 0;
        background-color: #000;
        color: #fff;
        border: 1px solid #fff;
        width: 100%;
        font-size: 16px;
    }
    .menu-section {
        margin: 20px 0;
        border-bottom: 1px solid #fff;
        padding-bottom: 10px;
    }
    .cart {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #fff;
    }
    .message {
        margin-top: 10px;
        font-style: italic;
        color: #fff;
    }
</style>
</head>
<body>

<div class="container" id="languageChoice">
    <h1>Welcome / Bienvenue / Welkom</h1>
    <p>Choisissez votre langue :</p>
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('fr')">Français</button>
    <button onclick="setLanguage('nl')">Nederlands</button>
</div>

<div class="container" id="menu" style="display:none;">
    <h1>🍔 Brunch & Smash Burger</h1>

    <div class="menu-section">
        <h2>Smash Burgers</h2>
        <select id="burgerSelect">
            <option value="5">Small Smash - 5€</option>
            <option value="7.5">Classic Smash - 7.5€</option>
            <option value="8.5">Chèvre Smash - 8.5€</option>
            <option value="9.5">Truffe Smash - 9.5€</option>
            <option value="9.5">BBQ Smash - 9.5€</option>
            <option value="9.5">Raclette Smash - 9.5€</option>
            <option value="8.5">Crispy Chicken - 8.5€</option>
        </select>
        <button onclick="addItem('Smash Burger')">Ajouter au panier</button>
    </div>

    <div class="menu-section">
        <h2>Baguettes</h2>
        <select id="baguetteSelect">
            <option value="9.5">Baguette Merguez - 9.5€</option>
            <option value="9.5">Baguette Merguez Piquante - 9.5€</option>
            <option value="9.5">Baguette Saucisse Poulet - 9.5€</option>
            <option value="9.5">Baguette Kefta - 9.5€</option>
        </select>
        <button onclick="addItem('Baguette')">Ajouter au panier</button>
    </div>

    <div class="menu-section">
        <h2>Sides</h2>
        <select id="sideSelect">
            <option value="3.5">Frites Maison - 3.5€</option>
            <option value="5.5">Frites Lardon Hot Cheddar - 5.5€</option>
            <option value="6">Tenders - 6€</option>
            <option value="5">Frites Patate Douce - 5€</option>
            <option value="2">Croquette Fromage - 2€</option>
        </select>
        <button onclick="addItem('Side')">Ajouter au panier</button>
    </div>

    <div class="menu-section">
        <h2>Desserts</h2>
        <select id="dessertSelect">
            <option value="6">Moelleux au Chocolat - 6€</option>
            <option value="4">Tiramisu - 4€</option>
            <option value="6.5">Brioche Perdue - 6.5€</option>
        </select>
        <button onclick="addItem('Dessert')">Ajouter au panier</button>
    </div>

    <div class="menu-section">
        <h2>Boissons</h2>
        <select id="drinkSelect">
            <option value="2">Pepsi - 2€</option>
            <option value="2">Ice Tea - 2€</option>
            <option value="2">Oasis Pomme Poire - 2€</option>
            <option value="4">Milk-Shake - 4€</option>
        </select>
        <button onclick="addItem('Boisson')">Ajouter au panier</button>
    </div>

    <div class="cart" id="cart">
        <h2>Votre Panier</h2>
        <ul id="cartItems"></ul>
        <p id="total">Total: 0€</p>
        <p id="finalMessage"></p>
    </div>
</div>

<script>
    const messages = [
        "Bonne appétit !",
        "Régalez-vous !",
        "Vous avez de la chance de manger chez nous !",
        "La qualité est toujours au rendez-vous !",
        "Quel smash burger incroyable !",
        "Spoiler : quoi que vous choisissiez, ce sera délicieux !",
        "Excellent choix !",
        "Bon choix !"
    ];

    let cart = [];
    let total = 0;

    function setLanguage(lang) {
        document.getElementById('languageChoice').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
        if(lang !== 'fr') alert("Language selection currently only affects text layout.");
    }

    function addItem(category) {
        let selectId = '';
        switch(category) {
            case 'Smash Burger': selectId = 'burgerSelect'; break;
            case 'Baguette': selectId = 'baguetteSelect'; break;
            case 'Side': selectId = 'sideSelect'; break;
            case 'Dessert': selectId = 'dessertSelect'; break;
            case 'Boisson': selectId = 'drinkSelect'; break;
        }

        let select = document.getElementById(selectId);
        let name = select.options[select.selectedIndex].text.split(' - ')[0];
        let price = parseFloat(select.value);

        cart.push({name, price});
        total += price;

        let cartList = document.getElementById('cartItems');
        let li = document.createElement('li');
        li.textContent = `${name} - ${price}€`;
        cartList.appendChild(li);

        document.getElementById('total').textContent = `Total: ${total.toFixed(2)}€`;

        // Message aléatoire
        let message = messages[Math.floor(Math.random() * messages.length)];
        document.getElementById('finalMessage').textContent = message;
    }
</script>

</body>
</html>
