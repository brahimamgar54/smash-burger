        :root {
            --bg: #ffffff;

            --border: #000000;
            --soldout: #999999;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {

            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            padding-bottom: 80px;
        }

        /* ECRAN DE LANGUE */
        #lang-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .lang-btn {
            background: transparent; color: var(--text);
            border: 1px solid var(--border);
            padding: 15px 40px; margin: 10px; font-size: 18px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.3s ease;
            width: 250px; text-align: center;
        }
        .lang-btn:hover, .lang-btn:active { background: var(--text); color: var(--bg); }

        /* HEADER PRO */
        header { text-align: center; padding: 40px 20px 30px 20px; border-bottom: 1px solid var(--border); }
        .logo-icon { font-size: 32px; margin-bottom: 10px; cursor: pointer; user-select: none; }
        h1 { font-size: 26px; letter-spacing: 3px; text-transform: uppercase; font-weight: 900; }
        .slogan { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; margin-top: 5px; }
        .rating { font-size: 14px; margin-top: 20px; font-weight: bold; display: inline-block; border: 1px solid var(--text); padding: 8px 20px; border-radius: 20px;}

        /* CONTENU PRINCIPAL */
        #app { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .section-title {
            font-size: 20px; font-weight: bold; text-transform: uppercase;
            border-bottom: 2px solid var(--border);
            padding-bottom: 5px; margin: 40px 0 15px 0; letter-spacing: 2px;
        }

        .item { margin-bottom: 25px; transition: opacity 0.3s; }
        .item-header { display: flex; justify-content: space-between; align-items: baseline; }
        .item-name { font-size: 16px; font-weight: bold; text-transform: uppercase; }
        .item-desc { font-size: 12px; color: #555555; margin: 5px 0 10px 0; }
        
        .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-add {
            flex: 1; background: transparent; color: var(--text);
            border: 1px solid var(--border); padding: 8px; font-size: 12px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; text-align: center;
            transition: background 0.2s, color 0.2s;
        }
        .btn-add:hover, .btn-add:active { background: var(--text); color: var(--bg); }
        .victime-succes { width: 100%; text-align: center; padding: 8px; font-size: 12px; font-weight: bold; border: 1px solid var(--text); color: var(--bg); background: var(--text); text-transform: uppercase; }

        /* PANIER & CHECKOUT */
        #cart-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--text); color: var(--bg);
            padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; z-index: 1000;
            font-weight: bold; text-transform: uppercase; border-top: 1px solid var(--border);
        }
        
        #cart-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: none; flex-direction: column;
            z-index: 2000; overflow-y: auto; padding-bottom: 20px;
        }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .close-cart { background: transparent; color: var(--text); border: none; font-size: 24px; cursor: pointer; font-weight: bold; }
        .cart-items { padding: 20px; flex-grow: 1; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dotted #ccc; padding: 15px 0; }
        .cart-item-info { flex: 1; font-weight: bold; }
        .btn-remove { background: transparent; color: #000; border: 1px solid #000; padding: 5px 10px; cursor: pointer; font-size: 11px; margin-left: 10px; font-weight: bold; text-transform: uppercase;}
        
        .checkout-area { padding: 20px; border-top: 1px solid var(--border); }
        .checkout-msg { font-size: 14px; text-align: center; margin-bottom: 20px; display: none; padding: 20px; border: 2px solid var(--text); background: var(--bg);}
        .btn-checkout { width: 100%; background: var(--text); color: var(--bg); border: none; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* TOAST (CITATIONS) */
        #toast {
            position: fixed; top: -150px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--bg); padding: 15px 20px;
            font-size: 14px; font-weight: bold; font-style: italic; text-align: center;
            width: 90%; max-width: 450px; z-index: 3000; border: 1px solid var(--bg);
            transition: top 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            line-height: 1.4;
        }
        #toast.show { top: 20px; }

        /* PANEL ADMIN */
        #admin-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: none; flex-direction: column;
            z-index: 10000; overflow-y: auto; padding: 20px; font-family: 'Helvetica Neue', Arial, sans-serif;

        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--text); padding-bottom: 10px; margin-bottom: 20px; }
        .admin-btn { background: var(--text); color: var(--bg); border: 1px solid var(--text); padding: 8px 12px; font-size: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; margin: 5px 0;}
        .admin-btn-outline { background: transparent; color: var(--text); border: 1px solid var(--text); padding: 5px 10px; font-size: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-right: 5px;}
        .admin-cat-block { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        .admin-item-block { border-top: 1px dashed #ccc; padding: 10px 0; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;}
    </style>
</head>

                if(item.outOfStock) itemDiv.style.opacity = '0.6';

                    buttonsHtml = `<button class="btn-add" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.priceAlone}, false, '${cat.id}')">+ AJOUTER - ${item.priceAlone}€</button>`;
                }

                itemDiv.innerHTML = `
                    <div class="item-header">
                        <span class="item-name" ${item.outOfStock ? 'style="text-decoration:line-through;"' : ''}>${item.name}</span>
                    </div>
                    ${descHtml}
                    <div class="action-row">
                        ${buttonsHtml}
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }
    }

    function addToCart(name, price, isMenu, categoryId) {
        const itemName = isMenu ? name + " (MENU)" : name;
        cart.push({ name: itemName, price: price });
        updateCart();
        showQuote();

        setTimeout(() => {
            if (categoryId === 'smash' || categoryId === 'baguettes') {
                document.getElementById('extras').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else if (categoryId === 'extras') {
                document.getElementById('drinks').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else if (categoryId === 'drinks') {
                document.getElementById('desserts').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else if (categoryId === 'desserts') {
                document.getElementById('sides').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 800);
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
        if(cart.length === 0) closeCart();
    }

    function updateCart() {
        const cartBar = document.getElementById('cart-bar');
        const cartTotalText = document.getElementById('cart-total-bar');
        const itemsContainer = document.getElementById('cart-items-container');
        
        cartBar.style.display = cart.length > 0 ? 'flex' : 'none';

        currentTotal = 0;
        itemsContainer.innerHTML = '';

        cart.forEach((item, index) => {
            currentTotal += item.price;
            itemsContainer.innerHTML += `
                <div class="cart-item">
                    <div class="cart-item-info">${item.name}</div>
                    <div style="font-weight:bold;">${item.price.toFixed(2)}€</div>
                    <button class="btn-remove" onclick="removeFromCart(${index})">${ui[currentLang].remove}</button>
                </div>
            `;
        });

        if (cart.length === 0) {
            itemsContainer.innerHTML = `<p style="text-align:center; padding:20px;">${ui[currentLang].empty}</p>`;
        }

        cartTotalText.innerText = `${ui[currentLang].total}: ${currentTotal.toFixed(2)}€`;
        document.getElementById('btn-validate').style.display = cart.length > 0 ? 'block' : 'none';
        document.getElementById('checkout-message').style.display = 'none';
    }

    function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
    function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

    function showQuote() {
        const toast = document.getElementById('toast');
        const quotesArray = quotes[currentLang];
        const randomQuote = quotesArray[Math.floor(Math.random() * quotesArray.length)];
        
        toast.innerText = randomQuote;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 10000);
    }

    function validateOrder() {
        const msgDiv = document.getElementById('checkout-message');
        document.getElementById('btn-validate').style.display = 'none';
        
        const removeBtns = document.querySelectorAll('.btn-remove');
        removeBtns.forEach(btn => btn.style.display = 'none');

        const finalHtml = `
            ${ui[currentLang].finalMsg}
            <div style="margin-top:20px; font-size: 20px; font-weight: 900; border-top: 2px solid var(--text); padding-top: 15px;">
                TOTAL À RÉGLER : ${currentTotal.toFixed(2)}€
            </div>
        `;
        
        msgDiv.innerHTML = finalHtml;
        msgDiv.style.display = 'block';
    }

    // --- FONCTIONS ADMIN (NOUVEAU) ---

    function checkSecret() {
        clickCount++;
        clearTimeout(clickTimeout);
        if (clickCount >= 3) {
            clickCount = 0;
            let pin = prompt("Code PIN Administrateur (4 chiffres) :");
            if (pin === adminPin) openAdmin();
            else if (pin !== null) alert("Code PIN incorrect.");
        } else {
            clickTimeout = setTimeout(() => { clickCount = 0; }, 1000);
        }
    }

    function saveMenuData() {
        localStorage.setItem('smash_menuData', JSON.stringify(menuData));
        renderMenu();
        renderAdmin();
    }

    function openAdmin() {
        document.getElementById('admin-panel').style.display = 'block';
        renderAdmin();
    }

    function closeAdmin() {
        document.getElementById('admin-panel').style.display = 'none';
    }

    function adminChangePin() {
        let newPin = prompt("Nouveau code PIN à 4 chiffres :", adminPin);
        if (newPin && newPin.trim().length > 0) {
            adminPin = newPin.trim();
            localStorage.setItem('smash_adminPin', adminPin);
            alert("Code PIN modifié avec succès.");
        }
    }

    function adminResetData() {
        if(confirm("Attention, cela va effacer toutes vos modifications et remettre le menu par défaut. Continuer ?")) {
            menuData = JSON.parse(JSON.stringify(defaultMenuData));
            saveMenuData();
        }
    }

    function adminAddCategory() {
        let titleFr = prompt("Nom de la catégorie (ex: BOISSONS CHAUDES) :");
        if (!titleFr) return;
        let id = "cat_" + Date.now();
        menuData[id] = { id: id, title: { fr: titleFr, en: titleFr, nl: titleFr }, items: [] };
        saveMenuData();
    }

    function adminDeleteCategory(catKey) {
        if(confirm("Supprimer cette catégorie et tout ce qu'elle contient ?")) {
            delete menuData[catKey];
            saveMenuData();
        }
    }

    function adminAddItem(catKey) {
        let name = prompt("Nom du produit :");
        if (!name) return;
        let price = parseFloat(prompt("Prix seul (ex: 5.50) :"));
        if (isNaN(price)) return;
        let desc = prompt("Description (optionnel) :");
        
        let hasMenu = confirm("Voulez-vous ajouter un prix MENU (Frites + Boisson) pour cet article ?");
        let priceMenu = null;
        if (hasMenu) {
            priceMenu = parseFloat(prompt("Prix du Menu (ex: 8.50) :"));
            if (isNaN(priceMenu)) priceMenu = null;
        }

        let newItem = { id: "item_" + Date.now(), name: name, priceAlone: price };
        if (desc) newItem.desc = { fr: desc, en: desc, nl: desc };
        if (priceMenu) newItem.priceMenu = priceMenu;

        menuData[catKey].items.push(newItem);
        saveMenuData();
    }

    function adminEditItem(catKey, itemIndex) {
        let item = menuData[catKey].items[itemIndex];
        
        let newName = prompt("Modifier le nom :", item.name);
        if(newName !== null) item.name = newName;

        let currentDesc = item.desc ? (item.desc.fr || "") : "";
        let newDesc = prompt("Modifier la description :", currentDesc);
        if(newDesc !== null) item.desc = { fr: newDesc, en: newDesc, nl: newDesc };

        let newPrice = prompt("Modifier le prix seul :", item.priceAlone);
        if(newPrice !== null && !isNaN(parseFloat(newPrice))) item.priceAlone = parseFloat(newPrice);

        if (item.priceMenu !== undefined) {
            let newPriceMenu = prompt("Modifier le prix Menu :", item.priceMenu);
            if(newPriceMenu !== null && !isNaN(parseFloat(newPriceMenu))) item.priceMenu = parseFloat(newPriceMenu);
        }

        saveMenuData();
    }

    function adminToggleStock(catKey, itemIndex) {
        let item = menuData[catKey].items[itemIndex];
        item.outOfStock = !item.outOfStock;
        saveMenuData();
    }

    function adminDeleteItem(catKey, itemIndex) {
        if(confirm("Supprimer cet article définitivement ?")) {
            menuData[catKey].items.splice(itemIndex, 1);
            saveMenuData();
        }
    }

    function renderAdmin() {
        const container = document.getElementById('admin-content');
        container.innerHTML = '';

        for (const catKey in menuData) {
            const cat = menuData[catKey];
            
            let html = `<div class="admin-cat-block">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="text-transform:uppercase;">${cat.title.fr}</h3>
                    <div>
                        <button class="admin-btn-outline" onclick="adminAddItem('${catKey}')">+ Produit</button>
                        <button class="admin-btn-outline" style="color:red; border-color:red;" onclick="adminDeleteCategory('${catKey}')">Suppr. Catégorie</button>
                    </div>
                </div>
            `;

            cat.items.forEach((item, index) => {
                html += `
                    <div class="admin-item-block">
                        <div style="flex:1;">
                            <strong style="${item.outOfStock ? 'text-decoration:line-through; color:#999;' : ''}">${item.name}</strong> - ${item.priceAlone}€ ${item.priceMenu ? ' (Menu: '+item.priceMenu+'€)' : ''}
                        </div>
                        <div style="display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end;">
                            <button class="admin-btn-outline" onclick="adminToggleStock('${catKey}', ${index})">
                                ${item.outOfStock ? 'Remettre en Stock' : 'Pénurie (Croix)'}
                            </button>
                            <button class="admin-btn-outline" onclick="adminEditItem('${catKey}', ${index})">Modifier</button>
                            <button class="admin-btn-outline" style="color:red; border-color:red;" onclick="adminDeleteItem('${catKey}', ${index})">X</button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML += html;
        }
    }

</script>
</body>
</html>
