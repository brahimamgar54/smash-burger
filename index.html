            padding: 15px 40px; margin: 10px; font-size: 18px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;

            width: 250px; text-align: center;

        .lang-btn:hover, .lang-btn:active { background: var(--text); color: var(--bg); }

        header { text-align: center; padding: 40px 20px 30px 20px; border-bottom: 1px solid var(--border); }

        .item-desc { font-size: 12px; color: #555555; margin: 5px 0 10px 0; }

        .item.out-of-stock .item-name {
            text-decoration: line-through 2px var(--soldout-strike);
            color: #777;
        }
        .item.out-of-stock .item-desc {
            text-decoration: line-through 1px var(--soldout-strike);
            color: #999;

            color: var(--soldout-strike);
            font-weight: bold;
            padding: 5px 0;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-top: 1px dashed #ccc;

            cursor: pointer; text-transform: uppercase; text-align: center;

                    "« La route ? Là où on va, on n'a pas besoin de route... juste d'un bon repas. » (Retour vers le futur)",
                    "« Soyez insatiables, soyez fous. » (Steve Jobs)",
                    "« Un petit pas pour l'homme, un grand bond pour votre estomac. » (Neil Armstrong)",
                    "« Vos papilles ont dépensé sans compter ! » (Jurassic Park)"
                ],
                en: [
                    "« I am not in danger. I am the danger... and the one ordering. » (Breaking Bad)",
                    "« The first rule of Smash Club: you DO talk about Smash Club. » (Fight Club)",
                    "« Take the blue pill, you wake up in your bed. Take this menu, and you stay in Wonderland. » (The Matrix)",
                    "« One burger to rule them all, and in the sauce bind them. » (The Lord of the Rings)",
                    "« The only true wisdom is in knowing you cannot resist this meal. » (Socrates)",
                    "« That which does not kill us makes us hungry. » (Nietzsche)",
                    "« Roads? Where we're going, we don't need roads... just a good meal. » (Back to the Future)",
                    "« Stay hungry, stay foolish. » (Steve Jobs)",
                    "« That's one small step for man, one giant leap for your stomach. » (Neil Armstrong)",
                    "« Your taste buds spared no expense! » (Jurassic Park)"
                ],
                nl: [
                    "« Ik ben niet in gevaar. Ik ben het gevaar... en degene die bestelt. » (Breaking Bad)",
                    "« De eerste regel van Smash Club: je MOET praten over Smash Club. » (Fight Club)",
                    "« Neem de blauwe pil en je wordt wakker. Neem dit menu, en blijf in Wonderland. » (The Matrix)",
                    "« Eén burger om hen allen te regeren, en in de saus te binden. » (The Lord of the Rings)",
                    "« De enige echte wijsheid is weten dat je deze maaltijd niet kunt weerstaan. » (Socrates)",
                    "« Wat ons niet doodt, maakt ons hongerig. » (Nietzsche)",
                    "« Wegen? Waar we heen gaan, hebben we geen wegen nodig... alleen een goede maaltijd. » (Back to the Future)",
                    "« Blijf hongerig, blijf dwaas. » (Steve Jobs)",
                    "« Een kleine stap voor een mens, een reuzensprong voor je maag. » (Neil Armstrong)",
                    "« Je smaakpapillen hebben kosten noch moeite gespaard! » (Jurassic Park)"
                ]
            };

            let currentLang = 'fr';
            let cart = [];
            let currentTotal = 0;
            let toastTimeout;
            
            // Easter egg
            let clickCount = 0;
            let clickTimeout;

            // ========== NOUVELLES FONCTIONS GITHUB ==========

            // Charger le menu depuis GitHub (raw)
            async function loadMenuFromGitHub() {
                const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_PATH}`;
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        const data = await response.json();
                        menuData = data;
                    } else {
                        // Fichier n'existe pas encore -> on utilise le défaut et on le crée
                        menuData = JSON.parse(JSON.stringify(defaultMenuData));
                        await saveMenuToGitHub(menuData); // création initiale
                    }
                } catch (e) {
                    console.error('Erreur chargement GitHub', e);
                    menuData = JSON.parse(JSON.stringify(defaultMenuData));
                }
                renderMenu();
            }

            // Sauvegarder le menu sur GitHub (API) - Version améliorée avec gestion d'erreur
            async function saveMenuToGitHub(updatedMenu) {
                const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
                
                // Récupérer le SHA actuel
                let sha = null;
                try {
                    const getResponse = await fetch(apiUrl, {
                        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                    });
                    if (getResponse.ok) {
                        const fileInfo = await getResponse.json();
                        sha = fileInfo.sha;
                    } else {
                        // Si le fichier n'existe pas, on continue sans SHA
                        console.log('Fichier non trouvé, création nouvelle');
                    }
                } catch (e) {
                    console.warn('Impossible de récupérer le SHA', e);
                }

                const content = btoa(unescape(encodeURIComponent(JSON.stringify(updatedMenu, null, 2))));

                const body = {
                    message: 'Mise à jour du menu via admin',
                    content: content,
                    ...(sha && { sha })
                };

                try {
                    const putResponse = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    const responseData = await putResponse.json();

                    if (putResponse.ok) {
                        console.log('Menu mis à jour sur GitHub');
                        alert('Sauvegarde réussie !');
                    } else {
                        console.error('Erreur détaillée GitHub :', responseData);
                        alert(`Erreur GitHub : ${responseData.message || 'inconnue'}\n\nVoir console pour détails.`);
                    }
                } catch (e) {
                    console.error('Erreur réseau', e);
                    alert('Erreur réseau : ' + e.message);
                }
            }

            // ========== FONCTIONS EXISTANTES MODIFIÉES ==========

            function initApp(lang) {
                currentLang = lang;
                document.getElementById('lang-screen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                
                document.getElementById('ui-view-cart').innerText = ui[lang].viewCart;
                document.getElementById('ui-cart-title').innerText = ui[lang].viewCart;
                document.getElementById('btn-validate').innerText = ui[lang].checkout;
                
                // Charger le menu depuis GitHub au lieu de render direct
                loadMenuFromGitHub();
            }

            // Sauvegarde modifiée : localStorage + GitHub
            async function saveMenuData() {
                localStorage.setItem('smash_menuData', JSON.stringify(menuData)); // garde locale
                await saveMenuToGitHub(menuData);
                renderMenu();
                renderAdmin();
            }

            // Les autres fonctions restent identiques (renderMenu, addToCart, etc.)
            function renderMenu() {
                const container = document.getElementById('menu-container');
                container.innerHTML = '';

                for (const catKey in menuData) {
                    const cat = menuData[catKey];
                    
                    const sectionTitle = document.createElement('h2');
                    sectionTitle.className = 'section-title';
                    sectionTitle.id = cat.id;
                    sectionTitle.innerText = cat.title[currentLang] || cat.title.fr;
                    container.appendChild(sectionTitle);

                    cat.items.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'item' + (item.outOfStock ? ' out-of-stock' : '');

                        let descHtml = '';
                        if (item.desc && (item.desc[currentLang] || item.desc.fr)) {
                            descHtml = `<div class="item-desc">${item.desc[currentLang] || item.desc.fr}</div>`;
                        }

                        let buttonsHtml = '';
                        if (item.outOfStock) {
                            buttonsHtml = `<div class="victime-succes">${ui[currentLang].soldout}</div>`;
                        } else if (item.priceMenu) {
                            buttonsHtml = `
                                <button class="btn-add" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.priceAlone}, false, '${cat.id}')">${ui[currentLang].addAlone} - ${item.priceAlone}€</button>
                                <button class="btn-add" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.priceMenu}, true, '${cat.id}')">${ui[currentLang].addMenu} - ${item.priceMenu}€</button>
                            `;
                        } else {
                            buttonsHtml = `<button class="btn-add" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.priceAlone}, false, '${cat.id}')">+ AJOUTER - ${item.priceAlone}€</button>`;
                        }

                        itemDiv.innerHTML = `
                            <div class="item-header">
                                <span class="item-name">${item.name}</span>
                            </div>
                            ${descHtml}
                            <div class="action-row">
                                ${buttonsHtml}
                            </div>
                        `;
                        container.appendChild(itemDiv);
                    });
                }
            }

            function addToCart(name, price, isMenu, categoryId) {
                const itemName = isMenu ? name + " (MENU)" : name;
                cart.push({ name: itemName, price: price });
                updateCart();
                showQuote();

                setTimeout(() => {
                    if (categoryId === 'smash' || categoryId === 'baguettes') {
                        document.getElementById('extras').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    } else if (categoryId === 'extras') {
                        document.getElementById('drinks').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    } else if (categoryId === 'drinks') {
                        document.getElementById('desserts').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    } else if (categoryId === 'desserts') {
                        document.getElementById('sides').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 800);
            }

            function removeFromCart(index) {
                cart.splice(index, 1);
                updateCart();
                if(cart.length === 0) closeCart();
            }

            function updateCart() {
                const cartBar = document.getElementById('cart-bar');
                const cartTotalText = document.getElementById('cart-total-bar');
                const itemsContainer = document.getElementById('cart-items-container');
                
                cartBar.style.display = cart.length > 0 ? 'flex' : 'none';

                currentTotal = 0;
                itemsContainer.innerHTML = '';

                cart.forEach((item, index) => {
                    currentTotal += item.price;
                    itemsContainer.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-info">${item.name}</div>
                            <div style="font-weight:bold;">${item.price.toFixed(2)}€</div>
                            <button class="btn-remove" onclick="removeFromCart(${index})">${ui[currentLang].remove}</button>
                        </div>
                    `;
                });

                if (cart.length === 0) {
                    itemsContainer.innerHTML = `<p style="text-align:center; padding:20px;">${ui[currentLang].empty}</p>`;
                }

                cartTotalText.innerText = `${ui[currentLang].total}: ${currentTotal.toFixed(2)}€`;
                document.getElementById('btn-validate').style.display = cart.length > 0 ? 'block' : 'none';
                document.getElementById('checkout-message').style.display = 'none';
                document.getElementById('post-validation-actions').style.display = 'none';
            }

            function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
            function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

            // --- QUOTES avec swipe up ---
            function showQuote() {
                const toast = document.getElementById('toast');
                const quotesArray = quotes[currentLang];
                const randomQuote = quotesArray[Math.floor(Math.random() * quotesArray.length)];
                
                toast.innerText = randomQuote;
                toast.classList.add('show');

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 5000);
            }

            // Swipe up pour fermer la citation
            let touchStartY = 0;
            document.getElementById('toast').addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            document.getElementById('toast').addEventListener('touchmove', (e) => {
                if (!touchStartY) return;
                let touchEndY = e.touches[0].clientY;
                let diff = touchStartY - touchEndY; // positif = swipe up
                if (diff > 30) {
                    document.getElementById('toast').classList.remove('show');
                    touchStartY = 0;
                }
            }, { passive: true });

            // --- VALIDATION COMMANDE ---
            function validateOrder() {
                const msgDiv = document.getElementById('checkout-message');
                document.getElementById('btn-validate').style.display = 'none';
                
                const table = document.getElementById('table-number').value;
                const finalHtml = `
                    ${ui[currentLang].finalMsg}
                    <div style="margin-top:20px; font-size: 20px; font-weight: 900; border-top: 2px solid var(--text); padding-top: 15px;">
                        TABLE ${table} • TOTAL ${currentTotal.toFixed(2)}€
                    </div>
                `;
                
                msgDiv.innerHTML = finalHtml;
                msgDiv.style.display = 'block';

                // Afficher les boutons d'envoi
                document.getElementById('post-validation-actions').style.display = 'block';
            }

            // --- ENVOI WHATSAPP ---
            function sendOrderWhatsapp() {
                if (!whatsappNumber) {
                    alert("Le numéro WhatsApp n'est pas configuré (admin).");
                    return;
                }
                let orderDetails = "NOUVELLE COMMANDE\n";
                orderDetails += `Table ${document.getElementById('table-number').value}\n`;
                cart.forEach(item => {
                    orderDetails += `• ${item.name} : ${item.price.toFixed(2)}€\n`;
                });
                orderDetails += `\nTOTAL : ${currentTotal.toFixed(2)}€`;
                const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(orderDetails)}`;
                window.open(url, '_blank');
            }

            // --- ENVOI SMS (remplace email) ---
            function sendOrderSMS() {
                if (!whatsappNumber) {
                    alert("Le numéro de téléphone n'est pas configuré (admin).");
                    return;
                }
                let orderDetails = "Commande Table " + document.getElementById('table-number').value + " : ";
                cart.forEach(item => {
                    orderDetails += `${item.name} ${item.price.toFixed(2)}€, `;
                });
                orderDetails += ` Total ${currentTotal.toFixed(2)}€`;
                const url = `sms:${whatsappNumber}?body=${encodeURIComponent(orderDetails)}`;
                window.location.href = url;
            }

            // --- ADMIN : whatsapp ---
            function adminSetWhatsapp() {
                let num = prompt("Numéro de téléphone (international, sans + ni espaces) pour WhatsApp et SMS :", whatsappNumber);
                if (num !== null) {
                    whatsappNumber = num.trim();
                    localStorage.setItem('smash_whatsapp', whatsappNumber);
                    alert("Numéro enregistré.");
                }
            }

            // --- AUTH ADMIN ---
            function checkSecret() {
                clickCount++;
                clearTimeout(clickTimeout);
                if (clickCount >= 3) {
                    clickCount = 0;
                    let pin = prompt("Code PIN Administrateur (4 chiffres) :");
                    if (pin === adminPin) openAdmin();
                    else if (pin !== null) alert("Code PIN incorrect.");
                } else {
                    clickTimeout = setTimeout(() => { clickCount = 0; }, 1000);
                }
            }

            function openAdmin() {
                document.getElementById('admin-panel').style.display = 'block';
                renderAdmin();
            }

            function closeAdmin() {
                document.getElementById('admin-panel').style.display = 'none';
            }

            function adminChangePin() {
                let newPin = prompt("Nouveau code PIN à 4 chiffres :", adminPin);
                if (newPin && newPin.trim().length > 0) {
                    adminPin = newPin.trim();
                    localStorage.setItem('smash_adminPin', adminPin);
                    alert("Code PIN modifié.");
                }
            }

            function adminResetData() {
                if(confirm("Remettre le menu par défaut ?")) {
                    menuData = JSON.parse(JSON.stringify(defaultMenuData));
                    saveMenuData();
                }
            }

            function adminAddCategory() {
                let titleFr = prompt("Nom de la catégorie (ex: BOISSONS CHAUDES) :");
                if (!titleFr) return;
                let id = "cat_" + Date.now();
                menuData[id] = { id: id, title: { fr: titleFr, en: titleFr, nl: titleFr }, items: [] };
                saveMenuData();
            }

            function adminDeleteCategory(catKey) {
                if(confirm("Supprimer cette catégorie ?")) {
                    delete menuData[catKey];
                    saveMenuData();
                }
            }

            function adminAddItem(catKey) {
                let name = prompt("Nom du produit :");
                if (!name) return;
                let price = parseFloat(prompt("Prix seul (ex: 5.50) :"));
                if (isNaN(price)) return;
                let desc = prompt("Description (optionnel) :");
                let hasMenu = confirm("Ajouter un prix MENU ?");
                let priceMenu = null;
                if (hasMenu) {
                    priceMenu = parseFloat(prompt("Prix du Menu (ex: 8.50) :"));
                    if (isNaN(priceMenu)) priceMenu = null;
                }

                let newItem = { id: "item_" + Date.now(), name: name, priceAlone: price };
                if (desc) newItem.desc = { fr: desc, en: desc, nl: desc };
                if (priceMenu) newItem.priceMenu = priceMenu;

                menuData[catKey].items.push(newItem);
                saveMenuData();
            }

            function adminEditItem(catKey, itemIndex) {
                let item = menuData[catKey].items[itemIndex];
                
                let newName = prompt("Modifier le nom (FR) :", item.name);
                if(newName !== null) item.name = newName;

                let currentDesc = item.desc ? (item.desc.fr || "") : "";
                let newDesc = prompt("Modifier la description (FR) :", currentDesc);
                if(newDesc !== null) item.desc = { fr: newDesc, en: newDesc, nl: newDesc };

                let newPrice = prompt("Modifier le prix seul :", item.priceAlone);
                if(newPrice !== null && !isNaN(parseFloat(newPrice))) item.priceAlone = parseFloat(newPrice);

                if (item.priceMenu !== undefined) {
                    let newPriceMenu = prompt("Modifier le prix Menu :", item.priceMenu);
                    if(newPriceMenu !== null && !isNaN(parseFloat(newPriceMenu))) item.priceMenu = parseFloat(newPriceMenu);
                }

                saveMenuData();
            }

            function adminToggleStock(catKey, itemIndex) {
                let item = menuData[catKey].items[itemIndex];
                item.outOfStock = !item.outOfStock;
                saveMenuData();
            }

            function adminDeleteItem(catKey, itemIndex) {
                if(confirm("Supprimer cet article ?")) {
                    menuData[catKey].items.splice(itemIndex, 1);
                    saveMenuData();
                }
            }

            function renderAdmin() {
                const container = document.getElementById('admin-content');
                container.innerHTML = '';

                for (const catKey in menuData) {
                    const cat = menuData[catKey];
                    
                    let html = `<div class="admin-cat-block">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <h3 style="text-transform:uppercase;">${cat.title.fr}</h3>
                            <div>
                                <button class="admin-btn-outline" onclick="adminAddItem('${catKey}')">+ Produit</button>
                                <button class="admin-btn-outline" style="color:red; border-color:red;" onclick="adminDeleteCategory('${catKey}')">Suppr. Catégorie</button>
                            </div>
                        </div>
                    `;

                    cat.items.forEach((item, index) => {
                        html += `
                            <div class="admin-item-block">
                                <div style="flex:1;">
                                    <strong style="${item.outOfStock ? 'text-decoration:line-through; color:#999;' : ''}">${item.name}</strong> - ${item.priceAlone}€ ${item.priceMenu ? ' (Menu: '+item.priceMenu+'€)' : ''}
                                </div>
                                <div style="display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end;">
                                    <button class="admin-btn-outline" onclick="adminToggleStock('${catKey}', ${index})">
                                        ${item.outOfStock ? 'Remettre' : 'Pénurie'}
                                    </button>
                                    <button class="admin-btn-outline" onclick="adminEditItem('${catKey}', ${index})">Modifier</button>
                                    <button class="admin-btn-outline" style="color:red; border-color:red;" onclick="adminDeleteItem('${catKey}', ${index})">X</button>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                    container.innerHTML += html;
                }
            }

            // Expose global
            window.initApp = initApp;
            window.addToCart = addToCart;
            window.removeFromCart = removeFromCart;
            window.openCart = openCart;
            window.closeCart = closeCart;
            window.validateOrder = validateOrder;
            window.checkSecret = checkSecret;
            window.openAdmin = openAdmin;
            window.closeAdmin = closeAdmin;
            window.adminAddCategory = adminAddCategory;
            window.adminChangePin = adminChangePin;
            window.adminResetData = adminResetData;
            window.adminAddItem = adminAddItem;
            window.adminEditItem = adminEditItem;
            window.adminToggleStock = adminToggleStock;
            window.adminDeleteItem = adminDeleteItem;
            window.adminDeleteCategory = adminDeleteCategory;
            window.adminSetWhatsapp = adminSetWhatsapp;
            window.sendOrderWhatsapp = sendOrderWhatsapp;
            window.sendOrderSMS = sendOrderSMS;
        })();
    </script>
</body>
</html>
