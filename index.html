<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRUNCH & SMASH</title>
    <style>
        :root { --bg: #000; --fg: #fff; --grey: #1a1a1a; --light-grey: #444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background: var(--bg); color: var(--fg); padding-bottom: 220px; }
        
        /* Language Overlay */
        #overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .lang-btn { background: none; border: 1px solid var(--fg); color: var(--fg); padding: 15px 40px; margin: 10px; cursor: pointer; text-transform: uppercase; width: 220px; }

        /* Header & Navigation */
        header { text-align: center; padding: 20px; border-bottom: 1px solid var(--fg); position: sticky; top: 0; background: var(--bg); z-index: 100; }
        .nav-crumbs { font-size: 0.7rem; color: var(--light-grey); margin-top: 10px; text-transform: uppercase; }
        
        /* Menu Sections */
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .section-title { border-left: 3px solid var(--fg); padding-left: 10px; margin: 25px 0 15px; text-transform: uppercase; font-size: 1rem; }
        .item { border-bottom: 1px solid var(--grey); padding: 15px 0; }
        .item-row { display: flex; justify-content: space-between; align-items: center; }
        .desc { font-size: 0.8rem; color: #888; margin-top: 5px; }
        
        /* Buttons */
        .btn-add { background: none; border: 1px solid var(--fg); color: var(--fg); padding: 8px 12px; font-size: 0.8rem; cursor: pointer; margin-left: 5px; }
        .btn-add:active { background: var(--fg); color: var(--bg); }
        .back-btn { background: var(--grey); border: none; color: #888; padding: 10px; width: 100%; margin-top: 20px; cursor: pointer; }

        /* Panier / Cart Sticky */
        .cart-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg); border-top: 1px solid var(--fg); padding: 15px; z-index: 500; }
        .cart-items { max-height: 100px; overflow-y: auto; font-size: 0.8rem; margin-bottom: 10px; }
        .cart-line { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px border var(--grey); }
        .remove-item { color: #ff4444; margin-left: 10px; cursor: pointer; text-decoration: underline; }
        .total-row { font-weight: bold; font-size: 1.1rem; display: flex; justify-content: space-between; border-top: 1px solid var(--fg); pt: 5px;}
        .quote-box { height: 40px; font-style: italic; font-size: 0.75rem; text-align: center; color: #aaa; margin-bottom: 5px; }
        .final-instruction { font-size: 0.8rem; text-align: center; margin-top: 10px; font-weight: bold; background: var(--fg); color: var(--bg); padding: 5px; text-transform: uppercase;}

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>SELECT LANGUAGE</h2>
        <button class="lang-btn" onclick="init('en')">English</button>
        <button class="lang-btn" onclick="init('fr')">Français</button>
        <button class="lang-btn" onclick="init('nl')">Nederlands</button>
    </div>

    <header>
        <div id="brand">BRUNCH & SMASH</div>
        <div id="crumbs" class="nav-crumbs">Home</div>
    </header>

    <div class="container" id="menu-view">
        </div>

    <div class="cart-footer">
        <div id="quote" class="quote-box">"Le seul vrai choix est celui qui n'a pas d'alternative."</div>
        <div class="cart-items" id="cart-list"></div>
        <div class="total-row">
            <span id="total-label">Total</span>
            <span id="total-price">0.00€</span>
        </div>
        <div id="instruction" class="final-instruction hidden"></div>
    </div>

    <script>
        let currentLang = 'fr';
        let cart = [];
        let currentStep = 'main'; // main, sides, drinks

        const translations = {
            fr: {
                main: "La Carte",
                sides: "Accompagnements & Sauces",
                drinks: "Boissons & Desserts",
                total: "Total",
                add: "Ajouter",
                solo: "Solo",
                menu: "Menu",
                back: "← Revenir en arrière",
                final: "Votre choix est fait. Signalez votre présence, l'excellence arrive.",
                quotes: [
                    "« Je vais lui faire une offre qu'il ne pourra pas refuser. » - Le Parrain",
                    "« Connais-toi toi-même, et connais ton Smash Burger. » - Socrate (presque)",
                    "« Ce n'est pas ce que vous mangez, c'est avec qui. Mais mangez bien quand même. »",
                    "« Le bonheur est une petite chose qui se grignote. »",
                    "« Choisir, c'est renoncer au reste... mais ici, tout est bon. »",
                    "« On ne naît pas burger, on le devient. » - Beauvoir revisité"
                ]
            },
            en: {
                main: "Menu",
                sides: "Sides & Sauces",
                drinks: "Drinks & Desserts",
                total: "Total",
                add: "Add",
                solo: "Single",
                menu: "Meal Deal",
                back: "← Back",
                final: "The choice is made. Signal your presence, excellence is on its way.",
                quotes: [
                    "\"I'm going to make him an offer he can't refuse.\" - The Godfather",
                    "\"Know thyself, and know thy Smash Burger.\" - Socrates (ish)",
                    "\"Choice is the only tool we have.\" - Matrix",
                    "\"Life is a series of choices. This is your best one today.\""
                ]
            },
            nl: {
                main: "Menu Kaart",
                sides: "Bijgerechten & Sauzen",
                drinks: "Dranken & Desserts",
                total: "Totaal",
                add: "Toevoegen",
                solo: "Enkel",
                menu: "Menu",
                back: "← Terug",
                final: "De keuze is gemaakt. Geef een teken, de kwaliteit komt eraan.",
                quotes: [
                    "\"Ik ga hem een voorstel doen dat hij niet kan weigeren.\"",
                    "\"Ken uzelf, en ken uw Smash Burger.\"",
                    "\"Geluk is iets kleins dat je kunt eten.\""
                ]
            }
        };

        const menuData = {
            smash: [
                { id: 's1', name: {fr:'Small Smash', en:'Small Smash', nl:'Small Smash'}, priceSolo: 5, priceMenu: 8.5, desc: {fr:'Boeuf, cheddar, salade, pickles', en:'Beef, cheddar, salad, pickles', nl:'Rundvlees, cheddar, salade'} },
                { id: 's2', name: {fr:'Classic Smash', en:'Classic Smash', nl:'Klassieke Smash'}, priceSolo: 7.5, priceMenu: 10.5, desc: {fr:'Double boeuf, double cheddar, sauce smash', en:'Double beef, double cheddar, smash sauce', nl:'Dubbel rundvlees, dubbele cheddar'} },
                { id: 's3', name: {fr:'Truffe Smash', en:'Truffle Smash', nl:'Truffel Smash'}, priceSolo: 9.5, priceMenu: 12.5, desc: {fr:'Double boeuf, oignons caramélisés, sauce truffe', en:'Double beef, caramelised onions, truffle sauce', nl:'Dubbel rundvlees, truffelsaus'} }
            ],
            baguettes: [
                { id: 'b1', name: {fr:'Baguette Kefta', en:'Kefta Baguette', nl:'Kefta Baguette'}, priceSolo: 9.5, priceMenu: 12.5 },
                { id: 'b2', name: {fr:'Baguette Merguez', en:'Merguez Baguette', nl:'Merguez Baguette'}, priceSolo: 9.5, priceMenu: 12.5 }
            ],
            sides: [
                { id: 'f1', name: {fr:'Frites Maison', en:'Homemade Fries', nl:'Verse Friet'}, price: 3.5 },
                { id: 'f2', name: {fr:'Tenders (4pcs)', en:'Chicken Tenders', nl:'Kip Tenders'}, price: 6.0 }
            ],
            drinks: [
                { id: 'd1', name: 'Pepsi', price: 2.0 },
                { id: 'd2', name: 'Ice Tea', price: 2.0 },
                { id: 'd3', name: 'Milk-Shake', price: 4.0 }
            ]
        };

        function init(lang) {
            currentLang = lang;
            document.getElementById('overlay').classList.add('hidden');
            renderMain();
        }

        function renderMain() {
            currentStep = 'main';
            const t = translations[currentLang];
            document.getElementById('crumbs').innerText = t.main;
            let html = `<div class="section-title">SMASH BURGERS</div>`;
            
            menuData.smash.forEach(item => {
                html += `
                    <div class="item">
                        <div class="item-row">
                            <span>${item.name[currentLang]}</span>
                            <div>
                                <button class="btn-add" onclick="addToCart('${item.name[currentLang]}', ${item.priceSolo}, true)">${t.solo} ${item.priceSolo}€</button>
                                <button class="btn-add" onclick="addToCart('${item.name[currentLang]} (Menu)', ${item.priceMenu}, true)">${t.menu} ${item.priceMenu}€</button>
                            </div>
                        </div>
                        <div class="desc">${item.desc[currentLang]}</div>
                    </div>
                `;
            });

            html += `<div class="section-title">BAGUETTES</div>`;
            menuData.baguettes.forEach(item => {
                html += `
                    <div class="item">
                        <div class="item-row">
                            <span>${item.name[currentLang]}</span>
                            <div>
                                <button class="btn-add" onclick="addToCart('${item.name[currentLang]}', ${item.priceSolo}, true)">${t.solo} ${item.priceSolo}€</button>
                                <button class="btn-add" onclick="addToCart('${item.name[currentLang]} (Menu)', ${item.priceMenu}, true)">${t.menu} ${item.priceMenu}€</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('menu-view').innerHTML = html;
        }

        function renderSides() {
            currentStep = 'sides';
            const t = translations[currentLang];
            document.getElementById('crumbs').innerText = t.sides;
            let html = `<button class="back-btn" onclick="renderMain()">${t.back}</button>`;
            html += `<div class="section-title">${t.sides}</div>`;
            
            menuData.sides.forEach(item => {
                html += `
                    <div class="item item-row">
                        <span>${item.name[currentLang]}</span>
                        <button class="btn-add" onclick="addToCart('${item.name[currentLang]}', ${item.price}, false, 'drinks')">${t.add} ${item.price}€</button>
                    </div>
                `;
            });
            document.getElementById('menu-view').innerHTML = html;
        }

        function renderDrinks() {
            currentStep = 'drinks';
            const t = translations[currentLang];
            document.getElementById('crumbs').innerText = t.drinks;
            let html = `<button class="back-btn" onclick="renderSides()">${t.back}</button>`;
            html += `<div class="section-title">${t.drinks}</div>`;
            
            menuData.drinks.forEach(item => {
                html += `
                    <div class="item item-row">
                        <span>${typeof item.name === 'object' ? item.name[currentLang] : item.name}</span>
                        <button class="btn-add" onclick="addToCart('${typeof item.name === 'object' ? item.name[currentLang] : item.name}', ${item.price}, false)">${t.add} ${item.price}€</button>
                    </div>
                `;
            });
            document.getElementById('menu-view').innerHTML = html;
        }

        function addToCart(name, price, autoNext, nextStep = 'sides') {
            cart.push({ id: Date.now(), name, price });
            updateCartUI();
            
            // Random quote
            const q = translations[currentLang].quotes;
            document.getElementById('quote').innerText = q[Math.floor(Math.random() * q.length)];

            if(autoNext) {
                if(nextStep === 'sides') renderSides();
            } else if (currentStep === 'sides') {
                renderDrinks();
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            const totalLabel = document.getElementById('total-price');
            const t = translations[currentLang];
            
            list.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'cart-line';
                div.innerHTML = `
                    <span>${item.name}</span>
                    <span>${item.price.toFixed(2)}€ <span class="remove-item" onclick="removeFromCart(${item.id})">X</span></span>
                `;
                list.appendChild(div);
            });

            totalLabel.innerText = `${total.toFixed(2)}€`;
            
            const inst = document.getElementById('instruction');
            if(cart.length > 0) {
                inst.innerText = t.final;
                inst.classList.remove('hidden');
            } else {
                inst.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
