<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUNCH & SMASH BURGER</title>
    <style>
        /* CSS BLANC ET NOIR - MINIMALISTE & PRO */
        :root {
            --bg: #ffffff;
            --text: #000000;
            --border: #000000;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            padding-bottom: 80px;
        }

        /* ECRAN DE LANGUE */
        #lang-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .lang-btn {
            background: transparent; color: var(--text);
            border: 1px solid var(--border);
            padding: 15px 40px; margin: 10px; font-size: 18px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.3s ease;
            width: 250px; text-align: center;
        }
        .lang-btn:hover, .lang-btn:active { background: var(--text); color: var(--bg); }

        /* HEADER PRO */
        header { text-align: center; padding: 30px 20px; border-bottom: 1px solid var(--border); }
        .logo-icon { font-size: 32px; margin-bottom: 10px; }
        h1 { font-size: 26px; letter-spacing: 3px; text-transform: uppercase; font-weight: 900; }
        .slogan { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; margin-top: 5px; }
        .rating { font-size: 14px; margin-top: 15px; font-weight: bold; display: inline-block; border: 1px solid var(--text); padding: 5px 15px; border-radius: 20px;}
        .philosophy { font-size: 12px; font-style: italic; color: #444; margin-top: 20px; max-width: 500px; margin-left: auto; margin-right: auto; line-height: 1.4; }

        /* CONTENU PRINCIPAL */
        #app { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .section-title {
            font-size: 20px; font-weight: bold; text-transform: uppercase;
            border-bottom: 2px solid var(--border);
            padding-bottom: 5px; margin: 40px 0 15px 0; letter-spacing: 2px;
        }

        .item { margin-bottom: 25px; }
        .item-header { display: flex; justify-content: space-between; align-items: baseline; }
        .item-name { font-size: 16px; font-weight: bold; text-transform: uppercase; }
        .item-desc { font-size: 12px; color: #555555; margin: 5px 0 10px 0; }
        
        .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-add {
            flex: 1; background: transparent; color: var(--text);
            border: 1px solid var(--border); padding: 8px; font-size: 12px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; text-align: center;
        }
        .btn-add:hover, .btn-add:active { background: var(--text); color: var(--bg); }

        /* PANIER & CHECKOUT */
        #cart-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--text); color: var(--bg);
            padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; z-index: 1000;
            font-weight: bold; text-transform: uppercase; border-top: 1px solid var(--border);
        }
        
        #cart-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: none; flex-direction: column;
            z-index: 2000; overflow-y: auto; padding-bottom: 20px;
        }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .close-cart { background: transparent; color: var(--text); border: none; font-size: 20px; cursor: pointer; font-weight: bold; }
        .cart-items { padding: 20px; flex-grow: 1; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dotted #ccc; padding: 15px 0; }
        .cart-item-info { flex: 1; font-weight: bold; }
        .btn-remove { background: transparent; color: #ff0000; border: 1px solid #ff0000; padding: 5px 10px; cursor: pointer; font-size: 12px; margin-left: 10px; font-weight: bold;}
        
        .checkout-area { padding: 20px; border-top: 1px solid var(--border); }
        .checkout-msg { font-size: 14px; text-align: center; margin-bottom: 20px; font-weight: bold; display: none; padding: 15px; border: 2px solid var(--text); background: #f9f9f9;}
        .btn-checkout { width: 100%; background: var(--text); color: var(--bg); border: none; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* TOAST (CITATIONS) */
        #toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--bg); padding: 15px 20px;
            font-size: 14px; font-style: italic; font-weight: bold; text-align: center;
            width: 90%; max-width: 400px; z-index: 3000; border: 1px solid var(--bg);
            transition: top 0.4s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #toast.show { top: 20px; }
    </style>
</head>

    // --- TRADUCTIONS UI ---

        fr: {

    // --- CITATIONS (FILMS / PHILO / SPORT) ---
    const quotes = {

    let currentLang = 'fr';
    let cart = [];
    let toastTimeout;

    // --- FONCTIONS ---

    function initApp(lang) {
        currentLang = lang;
        document.getElementById('lang-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        
        // Update UI Translations
        document.getElementById('ui-view-cart').innerText = ui[lang].viewCart;
        document.getElementById('ui-cart-title').innerText = ui[lang].viewCart;
        document.getElementById('btn-validate').innerText = ui[lang].checkout;
        document.getElementById('philosophy-text').innerText = ui[lang].philosophy;
        
        renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';

        for (const catKey in menuData) {
            const cat = menuData[catKey];
            
            const sectionTitle = document.createElement('h2');
            sectionTitle.className = 'section-title';
            sectionTitle.id = cat.id;
            sectionTitle.innerText = cat.title[currentLang];
            container.appendChild(sectionTitle);

            cat.items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';

                let descHtml = '';
                if (item.desc) {
                    descHtml = `<div class="item-desc">${item.desc[currentLang]}</div>`;
                }

                let buttonsHtml = '';
                if (item.priceMenu) {
                    buttonsHtml = `
                        <button class="btn-add" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.priceAlone}, false, '${cat.id}')">${ui[currentLang].addAlone} - ${item.priceAlone}€</button>
                        <button class="btn-add" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.priceMenu}, true, '${cat.id}')">${ui[currentLang].addMenu} - ${item.priceMenu}€</button>
                    `;
                } else {
                    buttonsHtml = `<button class="btn-add" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.priceAlone}, false, '${cat.id}')">+ AJOUTER - ${item.priceAlone}€</button>`;
                }

                itemDiv.innerHTML = `
                    <div class="item-header">
                        <span class="item-name">${item.name}</span>
                    </div>
                    ${descHtml}
                    <div class="action-row">
                        ${buttonsHtml}
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }
    }

    function addToCart(name, price, isMenu, categoryId) {
        const itemName = isMenu ? name + " (MENU)" : name;
        cart.push({ name: itemName, price: price });
        updateCart();
        showQuote();

        // Entonnoir : défilement auto vers l'étape logique suivante
        setTimeout(() => {
            if (categoryId === 'smash' || categoryId === 'baguettes') {
                document.getElementById('extras').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else if (categoryId === 'extras') {
                document.getElementById('drinks').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else if (categoryId === 'drinks' || categoryId === 'sides') {
                document.getElementById('desserts').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 700);
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
        if(cart.length === 0) closeCart();
    }

    function updateCart() {
        const cartBar = document.getElementById('cart-bar');
        const cartTotalText = document.getElementById('cart-total-bar');
        const itemsContainer = document.getElementById('cart-items-container');
        
        cartBar.style.display = cart.length > 0 ? 'flex' : 'none';

        let total = 0;
        itemsContainer.innerHTML = '';

        cart.forEach((item, index) => {
            total += item.price;
            itemsContainer.innerHTML += `
                <div class="cart-item">
                    <div class="cart-item-info">${item.name}</div>
                    <div>${item.price.toFixed(2)}€</div>
                    <button class="btn-remove" onclick="removeFromCart(${index})">${ui[currentLang].remove}</button>
                </div>
            `;
        });

        if (cart.length === 0) {
            itemsContainer.innerHTML = `<p style="text-align:center;">${ui[currentLang].empty}</p>`;
        }

        cartTotalText.innerText = `${ui[currentLang].total}: ${total.toFixed(2)}€`;
        document.getElementById('btn-validate').style.display = cart.length > 0 ? 'block' : 'none';
        document.getElementById('checkout-message').style.display = 'none';
    }

    function openCart() {
        document.getElementById('cart-modal').style.display = 'flex';
    }

    function closeCart() {
        document.getElementById('cart-modal').style.display = 'none';
    }

    function showQuote() {
        const toast = document.getElementById('toast');
        const quotesArray = quotes[currentLang];
        const randomQuote = quotesArray[Math.floor(Math.random() * quotesArray.length)];
        
        toast.innerText = `"${randomQuote}"`;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 4000);
    }

    function validateOrder() {
        const msgDiv = document.getElementById('checkout-message');
        document.getElementById('btn-validate').style.display = 'none';
        
        const removeBtns = document.querySelectorAll('.btn-remove');
        removeBtns.forEach(btn => btn.style.display = 'none');

        msgDiv.innerText = ui[currentLang].finalMsg;
        msgDiv.style.display = 'block';
    }

</script>
</body>
</html>
