<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUNCH & SMASH BURGER</title>
    <style>
        /* CSS STRICTEMENT NOIR ET BLANC */
        :root {
            --bg: #000000;
            --text: #ffffff;
            --border: #ffffff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            padding-bottom: 80px; /* Espace pour le panier en bas */
        }

        /* ECRAN DE LANGUE */
        #lang-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .lang-btn {
            background: transparent; color: var(--text);
            border: 1px solid var(--border);
            padding: 15px 40px; margin: 10px; font-size: 18px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.3s ease;
            width: 250px; text-align: center;
        }
        .lang-btn:hover, .lang-btn:active { background: var(--text); color: var(--bg); }

        /* HEADER */
        header { text-align: center; padding: 30px 20px; border-bottom: 1px solid var(--border); }
        h1 { font-size: 24px; letter-spacing: 3px; text-transform: uppercase; font-weight: 300; }
        .rating { font-size: 12px; margin-top: 10px; letter-spacing: 1px; }

        /* CONTENU PRINCIPAL */
        #app { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .section-title {
            font-size: 20px; font-weight: 400; text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px; margin: 30px 0 15px 0; letter-spacing: 2px;
        }

        .item { margin-bottom: 25px; }
        .item-header { display: flex; justify-content: space-between; align-items: baseline; }
        .item-name { font-size: 16px; font-weight: bold; text-transform: uppercase; }
        .item-desc { font-size: 12px; color: #aaaaaa; margin: 5px 0 10px 0; }
        
        .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-add {
            flex: 1; background: transparent; color: var(--text);
            border: 1px solid var(--border); padding: 8px; font-size: 12px;
            cursor: pointer; text-transform: uppercase; text-align: center;
        }
        .btn-add:hover, .btn-add:active { background: var(--text); color: var(--bg); }

        /* PANIER & CHECKOUT */
        #cart-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--text); color: var(--bg);
            padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; z-index: 1000;
            font-weight: bold; text-transform: uppercase; border-top: 1px solid var(--border);
        }
        
        #cart-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: none; flex-direction: column;
            z-index: 2000; overflow-y: auto; padding-bottom: 20px;
        }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .close-cart { background: transparent; color: var(--text); border: none; font-size: 20px; cursor: pointer; }
        .cart-items { padding: 20px; flex-grow: 1; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 15px 0; }
        .cart-item-info { flex: 1; }
        .btn-remove { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 5px 10px; cursor: pointer; font-size: 12px; margin-left: 10px; }
        
        .checkout-area { padding: 20px; border-top: 1px solid var(--border); }
        .checkout-msg { font-size: 14px; text-align: center; margin-bottom: 20px; font-style: italic; display: none;}
        .btn-checkout { width: 100%; background: var(--text); color: var(--bg); border: none; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* TOAST (CITATIONS) */
        #toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--bg); padding: 15px 20px;
            font-size: 14px; font-style: italic; font-weight: bold; text-align: center;
            width: 90%; max-width: 400px; z-index: 3000; border: 1px solid var(--bg);
            transition: top 0.4s ease;
        }
        #toast.show { top: 20px; }
    </style>
</head>
<body>

    <div id="lang-screen">
        <h1 style="margin-bottom: 40px;">BRUNCH & SMASH</h1>
        <button class="lang-btn" onclick="initApp('fr')">Français</button>
        <button class="lang-btn" onclick="initApp('en')">English</button>
        <button class="lang-btn" onclick="initApp('nl')">Nederlands</button>
    </div>

    <div id="toast"></div>

    <div id="app">
        <header>
            <h1>BRUNCH & SMASH BURGER</h1>
            <div class="rating">GOOGLE 4.9/5 | OPEN</div>
        </header>

        <div id="menu-container"></div>
    </div>

    <div id="cart-bar" style="display: none;" onclick="openCart()">
        <span id="cart-total-bar">TOTAL: 0.00€</span>
        <span id="ui-view-cart">VOIR PANIER</span>
    </div>

    <div id="cart-modal">
        <div class="cart-header">
            <h2 id="ui-cart-title" style="font-size: 18px; text-transform: uppercase;">VOTRE SÉLECTION</h2>
            <button class="close-cart" onclick="closeCart()">X</button>
        </div>
        <div class="cart-items" id="cart-items-container">
            </div>
        <div class="checkout-area">
            <div class="checkout-msg" id="checkout-message"></div>
            <button class="btn-checkout" id="btn-validate" onclick="validateOrder()">VALIDER LA COMMANDE</button>
        </div>
    </div>

<script>
    // --- DONNÉES DU MENU ---
    const menuData = {
        smash: {
            id: "smash",
            title: { fr: "SMASH BURGERS", en: "SMASH BURGERS", nl: "SMASH BURGERS" },
            items: [
                { id: "s1", name: "Small Smash", desc: { fr: "Potato bun, steak, cheddar, salade, tomate, cornichon, moutarde, ketchup", en: "Potato bun, beef patty, cheddar, lettuce, tomato, pickle, mustard, ketchup", nl: "Potato bun, runderpasteitje, cheddar, sla, tomaat, augurk, mosterd, ketchup" }, priceAlone: 5, priceMenu: 8.5 },
                { id: "s2", name: "Classic Smash", desc: { fr: "Potato bun, double steak, double cheddar, cornichon, sauce smash", en: "Potato bun, double beef, double cheddar, pickle, smash sauce", nl: "Potato bun, dubbel rundvlees, dubbele cheddar, augurk, smash saus" }, priceAlone: 7.5, priceMenu: 10.5 },
                { id: "s3", name: "Chèvre Smash", desc: { fr: "Potato bun, double steak, chèvre, salade, tomate, oignons caramélisés, miel, moutarde", en: "Potato bun, double beef, goat cheese, lettuce, tomato, caramelized onions, honey, mustard", nl: "Potato bun, dubbel rundvlees, geitenkaas, sla, tomaat, gekarameliseerde uien, honing, mosterd" }, priceAlone: 8.5, priceMenu: 11.5 },
                { id: "s4", name: "Truffe Smash", desc: { fr: "Potato bun, double steak, double cheddar, salade, tomate, oignons caramélisés, sauce truffe", en: "Potato bun, double beef, double cheddar, lettuce, tomato, caramelized onions, truffle sauce", nl: "Potato bun, dubbel rundvlees, dubbele cheddar, sla, tomaat, gekarameliseerde uien, truffelsaus" }, priceAlone: 9.5, priceMenu: 12.5 },
                { id: "s5", name: "BBQ Smash", desc: { fr: "Potato bun, double steak, double cheddar, bacon, salade, tomate, oignons caramélisés, sauce BBQ", en: "Potato bun, double beef, double cheddar, bacon, lettuce, tomato, caramelized onions, BBQ sauce", nl: "Potato bun, dubbel rundvlees, dubbele cheddar, bacon, sla, tomaat, gekarameliseerde uien, BBQ saus" }, priceAlone: 9.5, priceMenu: 12.5 },
                { id: "s6", name: "Raclette Smash", desc: { fr: "Potato bun, double steak, raclette savoyarde, salade, tomate, oignons caramélisés, sauce crème ail", en: "Potato bun, double beef, raclette cheese, lettuce, tomato, caramelized onions, garlic cream sauce", nl: "Potato bun, dubbel rundvlees, raclette kaas, sla, tomaat, gekarameliseerde uien, knoflookroomsaus" }, priceAlone: 9.5, priceMenu: 12.5 },
                { id: "s7", name: "Crispy chicken", desc: { fr: "Potato bun, poulet frit, double cheddar, salade, tomate, oignons caramélisés, mayo Sriracha", en: "Potato bun, fried chicken, double cheddar, lettuce, tomato, caramelized onions, Sriracha mayo", nl: "Potato bun, gebakken kip, dubbele cheddar, sla, tomaat, gekarameliseerde uien, Sriracha mayo" }, priceAlone: 8.5, priceMenu: 11.5 }
            ]
        },
        baguettes: {
            id: "baguettes",
            title: { fr: "BAGUETTES", en: "BAGUETTES", nl: "STOKBRODEN" },
            items: [
                { id: "b1", name: "Baguette Merguez", desc: { fr: "Pain frais, Merguez, double cheddar, oignons/cornichon, salade, tomate, sauce", en: "Fresh bread, Merguez, double cheddar, onions/pickles, lettuce, tomato, sauce", nl: "Vers brood, Merguez, dubbele cheddar, uien/augurken, sla, tomaat, saus" }, priceAlone: 9.5, priceMenu: 12.5 },
                { id: "b2", name: "Baguette Merguez Piquante", desc: { fr: "Pain frais, Merguez piquante, double cheddar, oignons/cornichon, salade, tomate, sauce", en: "Fresh bread, Spicy Merguez, double cheddar, onions/pickles, lettuce, tomato, sauce", nl: "Vers brood, Pittige Merguez, dubbele cheddar, uien/augurken, sla, tomaat, saus" }, priceAlone: 9.5, priceMenu: 12.5 },
                { id: "b3", name: "Baguette Saucisse Poulet", desc: { fr: "Pain frais, Saucisse poulet, double cheddar, oignons/cornichon, salade, tomate, sauce", en: "Fresh bread, Chicken sausage, double cheddar, onions/pickles, lettuce, tomato, sauce", nl: "Vers brood, Kippenworst, dubbele cheddar, uien/augurken, sla, tomaat, saus" }, priceAlone: 9.5, priceMenu: 12.5 },
                { id: "b4", name: "Baguette Kefta", desc: { fr: "Pain frais, Double steak, double cheddar, oignons/cornichon, salade, tomate, sauce", en: "Fresh bread, Double beef, double cheddar, onions/pickles, lettuce, tomato, sauce", nl: "Vers brood, Dubbel rundvlees, dubbele cheddar, uien/augurken, sla, tomaat, saus" }, priceAlone: 9.5, priceMenu: 12.5 }
            ]
        },
        sides: {
            id: "sides",
            title: { fr: "SIDES", en: "SIDES", nl: "BIJGERECHTEN" },
            items: [
                { id: "sd1", name: "Frites Maison", priceAlone: 3.5 },
                { id: "sd2", name: "Frites Lardon Hot Cheddar", priceAlone: 5.5 },
                { id: "sd3", name: "Tenders", priceAlone: 6 },
                { id: "sd4", name: "Frites Patate Douce", priceAlone: 5 },
                { id: "sd5", name: "Croquette Fromage", priceAlone: 2 }
            ]
        },
        drinks: {
            id: "drinks",
            title: { fr: "BOISSONS", en: "DRINKS", nl: "DRANKEN" },
            items: [
                { id: "d1", name: "Pepsi", priceAlone: 2 },
                { id: "d2", name: "Ice Tea", priceAlone: 2 },
                { id: "d3", name: "Ice Tea Pêche", priceAlone: 2 },
                { id: "d4", name: "Oasis Pomme Poire", priceAlone: 2 },
                { id: "d5", name: "Oasis Fraise Framboise", priceAlone: 2 },
                { id: "d6", name: "Oasis Tropical", priceAlone: 2 },
                { id: "d7", name: "Schweppes Agrume", priceAlone: 2 },
                { id: "d8", name: "Uludag", priceAlone: 2 },
                { id: "d9", name: "Thé à la Menthe", priceAlone: 2 },
                { id: "d10", name: "Milk-Shake", priceAlone: 4 }
            ]
        },
        desserts: {
            id: "desserts",
            title: { fr: "DESSERTS", en: "DESSERTS", nl: "DESSERTS" },
            items: [
                { id: "ds1", name: "Moelleux Chocolat (Glace & Chantilly)", priceAlone: 6 },
                { id: "ds2", name: "Tiramisu", priceAlone: 4 },
                { id: "ds3", name: "Brioche perdue", priceAlone: 6.5 }
            ]
        },
        extras: {
            id: "extras",
            title: { fr: "SUPPLÉMENTS", en: "EXTRAS", nl: "EXTRA'S" },
            items: [
                { id: "ex1", name: "Steak Haché", priceAlone: 2 },
                { id: "ex2", name: "Crispy Chicken", priceAlone: 2.5 },
                { id: "ex3", name: "Cornichons / Jalapeños", priceAlone: 0.5 },
                { id: "ex4", name: "Fromage (Chèvre, Provolone, Raclette...)", priceAlone: 1.5 },
                { id: "ex5", name: "Champignons Marinés", priceAlone: 1.5 },
                { id: "ex6", name: "Sauce Hot Cheddar", priceAlone: 1.5 },
                { id: "ex7", name: "Supplément Sauce", priceAlone: 1 }
            ]
        }
    };

    // --- TRADUCTIONS UI ---
    const ui = {
        fr: { viewCart: "VOIR PANIER", addAlone: "SEUL", addMenu: "MENU (+ FRITES & SAUCE)", total: "TOTAL", remove: "SUPPRIMER", empty: "Panier vide", checkout: "VALIDER LA COMMANDE", finalMsg: "Excellent choix. Veuillez présenter cette page à notre équipe pour valider l'envoi en cuisine." },
        en: { viewCart: "VIEW CART", addAlone: "ALONE", addMenu: "MENU (+ FRIES & SAUCE)", total: "TOTAL", remove: "REMOVE", empty: "Cart empty", checkout: "CONFIRM ORDER", finalMsg: "Excellent choice. Please present this screen to our team to send your order to the kitchen." },
        nl: { viewCart: "BEKIJK WINKELWAGEN", addAlone: "ALLEEN", addMenu: "MENU (+ FRIET & SAUS)", total: "TOTAAL", remove: "VERWIJDER", empty: "Winkelwagen leeg", checkout: "BESTELLING BEVESTIGEN", finalMsg: "Uitstekende keuze. Laat dit scherm aan ons team zien om uw bestelling naar de keuken te sturen." }
    };

    // --- CITATIONS (FILMS / PHILO) ---
    const quotes = {
        fr: [
            "L'appétit vient en mangeant.",
            "Il n'y a pas d'amour plus sincère que l'amour de la nourriture. (G.B. Shaw)",
            "Je vais lui faire une offre qu'il ne pourra pas refuser. (Le Parrain)",
            "Que la saveur soit avec toi. (Inspiré de Star Wars)",
            "La vie, c'est comme un menu de Smash Burgers, on y trouve toujours son bonheur."
        ],
        en: [
            "Appetite comes with eating.",
            "There is no sincerer love than the love of food. (G.B. Shaw)",
            "I'm going to make him a burger he can't refuse. (The Godfather)",
            "May the flavor be with you. (Star Wars inspired)",
            "Life is like a box of burgers, you always know it's going to be good."
        ],
        nl: [
            "De eetlust komt tijdens het eten.",
            "Er is geen oprechtere liefde dan de liefde voor eten. (G.B. Shaw)",
            "Ik ga hem een burger aanbieden die hij niet kan weigeren. (The Godfather)",
            "Moge de smaak met je zijn. (Star Wars geïnspireerd)",
            "Het leven is als een doos burgers, je weet altijd dat het goed zal zijn."
        ]
    };

    let currentLang = 'fr';
    let cart = [];
    let toastTimeout;

    // --- FONCTIONS ---

    function initApp(lang) {
        currentLang = lang;
        document.getElementById('lang-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('ui-view-cart').innerText = ui[lang].viewCart;
        document.getElementById('ui-cart-title').innerText = ui[lang].viewCart;
        document.getElementById('btn-validate').innerText = ui[lang].checkout;
        renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';

        for (const catKey in menuData) {
            const cat = menuData[catKey];
            
            // Titre de section
            const sectionTitle = document.createElement('h2');
            sectionTitle.className = 'section-title';
            sectionTitle.id = cat.id; // Pour l'ancre de défilement
            sectionTitle.innerText = cat.title[currentLang];
            container.appendChild(sectionTitle);

            // Articles
            cat.items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';

                let descHtml = '';
                if (item.desc) {
                    descHtml = `<div class="item-desc">${item.desc[currentLang]}</div>`;
                }

                let buttonsHtml = '';
                if (item.priceMenu) {
                    buttonsHtml = `
                        <button class="btn-add" onclick="addToCart('${item.name}', ${item.priceAlone}, false, '${cat.id}')">${ui[currentLang].addAlone} - ${item.priceAlone}€</button>
                        <button class="btn-add" onclick="addToCart('${item.name}', ${item.priceMenu}, true, '${cat.id}')">${ui[currentLang].addMenu} - ${item.priceMenu}€</button>
                    `;
                } else {
                    buttonsHtml = `<button class="btn-add" onclick="addToCart('${item.name}', ${item.priceAlone}, false, '${cat.id}')">+ AJOUTER - ${item.priceAlone}€</button>`;
                }

                itemDiv.innerHTML = `
                    <div class="item-header">
                        <span class="item-name">${item.name}</span>
                    </div>
                    ${descHtml}
                    <div class="action-row">
                        ${buttonsHtml}
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }
    }

    function addToCart(name, price, isMenu, categoryId) {
        const itemName = isMenu ? name + " (MENU)" : name;
        cart.push({ name: itemName, price: price });
        updateCart();
        showQuote();

        // Si l'utilisateur a choisi un plat principal, on le fait descendre vers les suppléments ou boissons
        if (categoryId === 'smash' || categoryId === 'baguettes') {
            setTimeout(() => {
                document.getElementById('drinks').scrollIntoView({ behavior: 'smooth' });
            }, 600); // Léger délai pour lui laisser voir la citation
        }
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
        
        // Si panier vide, on ferme le modal
        if(cart.length === 0) {
            closeCart();
        }
    }

    function updateCart() {
        const cartBar = document.getElementById('cart-bar');
        const cartTotalText = document.getElementById('cart-total-bar');
        const itemsContainer = document.getElementById('cart-items-container');
        
        if (cart.length > 0) {
            cartBar.style.display = 'flex';
        } else {
            cartBar.style.display = 'none';
        }

        let total = 0;
        itemsContainer.innerHTML = '';

        cart.forEach((item, index) => {
            total += item.price;
            itemsContainer.innerHTML += `
                <div class="cart-item">
                    <div class="cart-item-info">${item.name}</div>
                    <div>${item.price.toFixed(2)}€</div>
                    <button class="btn-remove" onclick="removeFromCart(${index})">${ui[currentLang].remove}</button>
                </div>
            `;
        });

        if (cart.length === 0) {
            itemsContainer.innerHTML = `<p style="text-align:center;">${ui[currentLang].empty}</p>`;
        }

        cartTotalText.innerText = `${ui[currentLang].total}: ${total.toFixed(2)}€`;
        document.getElementById('btn-validate').style.display = cart.length > 0 ? 'block' : 'none';
        document.getElementById('checkout-message').style.display = 'none';
    }

    function openCart() {
        document.getElementById('cart-modal').style.display = 'flex';
    }

    function closeCart() {
        document.getElementById('cart-modal').style.display = 'none';
    }

    function showQuote() {
        const toast = document.getElementById('toast');
        const quotesArray = quotes[currentLang];
        const randomQuote = quotesArray[Math.floor(Math.random() * quotesArray.length)];
        
        toast.innerText = `"${randomQuote}"`;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 6000); // Reste à l'écran 6 secondes comme demandé
    }

    function validateOrder() {
        const msgDiv = document.getElementById('checkout-message');
        document.getElementById('btn-validate').style.display = 'none';
        
        // Cache les boutons de suppression pour verrouiller la vue
        const removeBtns = document.querySelectorAll('.btn-remove');
        removeBtns.forEach(btn => btn.style.display = 'none');

        msgDiv.innerText = ui[currentLang].finalMsg;
        msgDiv.style.display = 'block';
    }

</script>
</body>
</html>
